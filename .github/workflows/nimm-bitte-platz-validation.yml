name: Validate Nimm Bitte Platz
on:
  push:
    paths:
      - mods/nimm-bitte-platz/Source/**
      - mods/nimm-bitte-platz/Manifest.json
      - tests/nimm-bitte-platz/**
      - .github/workflows/nimm-bitte-platz-validation.yml
  pull_request:
    paths:
      - mods/nimm-bitte-platz/**
      - tests/nimm-bitte-platz/**
      - .github/workflows/nimm-bitte-platz-validation.yml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and run offline behavior tests
        run: dotnet run --project tests/nimm-bitte-platz/NimmBittePlatz.OfflineTests.csproj --configuration Release
